services:
  postgres:
    image: postgres:16-alpine
    container_name: proms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-app_platform}
      POSTGRES_USER: ${DB_USER:-platform_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-platform_password}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-platform_user} -d ${DB_NAME:-app_platform}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - proms-net

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: proms-api:local
    container_name: proms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:8080'
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app_platform}
      DB_USER: ${DB_USER:-platform_user}
      DB_PASSWORD: ${DB_PASSWORD:-platform_password}
      DB_APP_USER: ${DB_APP_USER:-platform_user}
      LIQUIBASE_ENABLED: 'true'
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-platform_redis_pass}
      JAVA_OPTS: '-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/actuator/health/liveness || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - proms-net

  redis:
    image: redis:7-alpine
    container_name: proms-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-platform_redis_pass}']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:-platform_redis_pass} ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - proms-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  proms-net:
    driver: bridge
