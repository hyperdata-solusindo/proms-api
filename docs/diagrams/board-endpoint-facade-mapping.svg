<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1060" width="100%" height="100%" style="background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <!-- Straight arrow marker -->
    <marker id="arrow-straight" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .card-border { fill: #000000; stroke: #1e293b; stroke-width: 1; rx: 8px; }
    .title-text { fill: #64748b; font-size: 13.5px; font-weight: 500; }
    .box-rect { fill: #030712; stroke: #1f2937; stroke-width: 1; rx: 6px; }
    .box-text { fill: #f3f4f6; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12.5px; text-anchor: middle; dominant-baseline: central; }
    .arrow-line { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .label-text { fill: #94a3b8; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
    .label-bg { fill: #000000; }
    .db-rect { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 12px; ry: 12px; }
    .db-text { fill: #cbd5e1; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
    .facade-rect { fill: #1e40af; stroke: #3b82f6; stroke-width: 1; rx: 6px; }
    .facade-text { fill: #ffffff; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- ================= ROW 1: API-12 ================= -->
  <g transform="translate(30, 30)">
    <rect width="1280" height="180" class="card-border"/>
    <text x="24" y="28" class="title-text">1. API-12: List Boards</text>

    <!-- Endpoint -->
    <rect x="24" y="65" width="245" height="52" class="box-rect"/>
    <text x="146.5" y="91" class="box-text">GET /api/v1/boards</text>

    <!-- Arrow 1 -->
    <line x1="269" y1="91" x2="305" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Controller -->
    <rect x="305" y="65" width="205" height="52" class="box-rect"/>
    <text x="407.5" y="91" class="box-text">listBoards()</text>

    <!-- Arrow 2 -->
    <line x1="510" y1="91" x2="546" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Service -->
    <rect x="546" y="65" width="295" height="52" class="box-rect"/>
    <text x="693.5" y="91" class="box-text">boardService.listBoards()</text>

    <!-- Fork Curves -->
    <path d="M 841 91 C 885 91, 915 56, 1000 56" class="arrow-line" marker-end="url(#arrow)"/>
    <path d="M 841 91 C 885 91, 915 126, 1000 126" class="arrow-line" marker-end="url(#arrow)"/>

    <!-- Label -->
    <rect x="858" y="125" width="102" height="18" class="label-bg"/>
    <text x="909" y="134" class="label-text">The Golden Stack</text>

    <!-- Database -->
    <rect x="1010" y="32" width="246" height="48" class="db-rect"/>
    <text x="1133" y="48" class="db-text">BoardRepository &amp;</text>
    <text x="1133" y="64" class="db-text">BoardMemberRepository</text>

    <!-- Facade -->
    <rect x="1010" y="102" width="246" height="48" class="facade-rect"/>
    <text x="1133" y="118" class="facade-text">UserFacade</text>
    <text x="1133" y="134" class="facade-text">.findSummariesByIds(pmIds)</text>
  </g>

  <!-- ================= ROW 2: API-13 & API-23 ================= -->
  <g transform="translate(30, 230)">
    <rect width="1280" height="180" class="card-border"/>
    <text x="24" y="28" class="title-text">2. API-13 &amp; API-23: Board Detail &amp; Members</text>

    <!-- Endpoint -->
    <rect x="24" y="65" width="245" height="52" class="box-rect"/>
    <text x="146.5" y="91" class="box-text">GET /api/v1/boards/{id}</text>

    <!-- Arrow 1 -->
    <line x1="269" y1="91" x2="305" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Controller -->
    <rect x="305" y="65" width="205" height="52" class="box-rect"/>
    <text x="407.5" y="91" class="box-text">getBoardDetail(id)</text>

    <!-- Arrow 2 -->
    <line x1="510" y1="91" x2="546" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Service -->
    <rect x="546" y="65" width="295" height="52" class="box-rect"/>
    <text x="693.5" y="91" class="box-text">boardService.getBoardDetail(id)</text>

    <!-- Fork Curves -->
    <path d="M 841 91 C 885 91, 915 56, 1000 56" class="arrow-line" marker-end="url(#arrow)"/>
    <path d="M 841 91 C 885 91, 915 126, 1000 126" class="arrow-line" marker-end="url(#arrow)"/>

    <!-- Label -->
    <rect x="858" y="125" width="102" height="18" class="label-bg"/>
    <text x="909" y="134" class="label-text">The Golden Stack</text>

    <!-- Database -->
    <rect x="1010" y="32" width="246" height="48" class="db-rect"/>
    <text x="1133" y="48" class="db-text">BoardMemberRepository &amp;</text>
    <text x="1133" y="64" class="db-text">Columns &amp; Workstreams</text>

    <!-- Facade -->
    <rect x="1010" y="102" width="246" height="48" class="facade-rect"/>
    <text x="1133" y="118" class="facade-text">UserFacade</text>
    <text x="1133" y="134" class="facade-text">.findSummariesByIds(memberIds)</text>
  </g>

  <!-- ================= ROW 3: API-14 ================= -->
  <g transform="translate(30, 430)">
    <rect width="1280" height="180" class="card-border"/>
    <text x="24" y="28" class="title-text">3. API-14: Kanban Tasks</text>

    <!-- Endpoint -->
    <rect x="24" y="65" width="245" height="52" class="box-rect"/>
    <text x="146.5" y="91" class="box-text">GET /api/v1/boards/{id}/tasks</text>

    <!-- Arrow 1 -->
    <line x1="269" y1="91" x2="305" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Controller -->
    <rect x="305" y="65" width="205" height="52" class="box-rect"/>
    <text x="407.5" y="91" class="box-text">getBoardTasks(id, filter)</text>

    <!-- Arrow 2 -->
    <line x1="510" y1="91" x2="546" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Service -->
    <rect x="546" y="65" width="295" height="52" class="box-rect"/>
    <text x="693.5" y="91" class="box-text">boardService.getBoardTasks(id, filter)</text>

    <!-- Fork Curves -->
    <path d="M 841 91 C 885 91, 915 56, 1000 56" class="arrow-line" marker-end="url(#arrow)"/>
    <path d="M 841 91 C 885 91, 915 126, 1000 126" class="arrow-line" marker-end="url(#arrow)"/>

    <!-- Label -->
    <rect x="854" y="125" width="112" height="18" class="label-bg"/>
    <text x="910" y="134" class="label-text">Delegasi Data Task</text>

    <!-- Database -->
    <rect x="1010" y="32" width="246" height="48" class="db-rect"/>
    <text x="1133" y="48" class="db-text">BoardMemberRepository</text>
    <text x="1133" y="64" class="db-text">(Validasi Hak Akses 404)</text>

    <!-- Facade -->
    <rect x="1010" y="102" width="246" height="48" class="facade-rect"/>
    <text x="1133" y="118" class="facade-text">TaskFacade</text>
    <text x="1133" y="134" class="facade-text">.getTasksByBoard(id, filter)</text>
  </g>

  <!-- ================= ROW 4: API-19 ================= -->
  <g transform="translate(30, 630)">
    <rect width="1280" height="180" class="card-border"/>
    <text x="24" y="28" class="title-text">4. API-19: Quick Add Task</text>

    <!-- Endpoint -->
    <rect x="24" y="65" width="245" height="52" class="box-rect"/>
    <text x="146.5" y="91" class="box-text">POST /api/v1/boards/{id}/tasks</text>

    <!-- Arrow 1 -->
    <line x1="269" y1="91" x2="305" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Controller -->
    <rect x="305" y="65" width="205" height="52" class="box-rect"/>
    <text x="407.5" y="91" class="box-text">createBoardTask(id, req)</text>

    <!-- Arrow 2 -->
    <line x1="510" y1="91" x2="546" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Service -->
    <rect x="546" y="65" width="295" height="52" class="box-rect"/>
    <text x="693.5" y="91" class="box-text">boardService.createBoardTask(id, req)</text>

    <!-- Fork Curves -->
    <path d="M 841 91 C 885 91, 915 56, 1000 56" class="arrow-line" marker-end="url(#arrow)"/>
    <path d="M 841 91 C 885 91, 915 126, 1000 126" class="arrow-line" marker-end="url(#arrow)"/>

    <!-- Label -->
    <rect x="836" y="125" width="144" height="18" class="label-bg"/>
    <text x="908" y="134" class="label-text">Eksekusi Pembuatan Task</text>

    <!-- Database -->
    <rect x="1010" y="32" width="246" height="48" class="db-rect"/>
    <text x="1133" y="48" class="db-text">Validasi Board, Role (403),</text>
    <text x="1133" y="64" class="db-text">Kolom &amp; Workstream</text>

    <!-- Facade -->
    <rect x="1010" y="102" width="246" height="48" class="facade-rect"/>
    <text x="1133" y="118" class="facade-text">TaskFacade</text>
    <text x="1133" y="134" class="facade-text">.createTask(id, command)</text>
  </g>

  <!-- ================= ROW 5: API-44 ================= -->
  <g transform="translate(30, 830)">
    <rect width="1280" height="180" class="card-border"/>
    <text x="24" y="28" class="title-text">5. API-44: Board Chat Channels</text>

    <!-- Endpoint -->
    <rect x="24" y="65" width="245" height="52" class="box-rect"/>
    <text x="146.5" y="91" class="box-text">GET /api/v1/boards/{id}/chat/channels</text>

    <!-- Arrow 1 -->
    <line x1="269" y1="91" x2="305" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Controller -->
    <rect x="305" y="65" width="205" height="52" class="box-rect"/>
    <text x="407.5" y="91" class="box-text">getBoardChatChannels(id)</text>

    <!-- Arrow 2 -->
    <line x1="510" y1="91" x2="546" y2="91" class="arrow-line" marker-end="url(#arrow-straight)"/>

    <!-- Service -->
    <rect x="546" y="65" width="295" height="52" class="box-rect"/>
    <text x="693.5" y="91" class="box-text">boardService.getBoardChatChannels(id)</text>

    <!-- Fork Curves -->
    <path d="M 841 91 C 885 91, 915 56, 1000 56" class="arrow-line" marker-end="url(#arrow)"/>
    <path d="M 841 91 C 885 91, 915 126, 1000 126" class="arrow-line" marker-end="url(#arrow)"/>

    <!-- Label -->
    <rect x="844" y="125" width="128" height="18" class="label-bg"/>
    <text x="908" y="134" class="label-text">Delegasi Channel Chat</text>

    <!-- Database -->
    <rect x="1010" y="32" width="246" height="48" class="db-rect"/>
    <text x="1133" y="48" class="db-text">BoardMemberRepository</text>
    <text x="1133" y="64" class="db-text">(Validasi Hak Akses 404)</text>

    <!-- Facade -->
    <rect x="1010" y="102" width="246" height="48" class="facade-rect"/>
    <text x="1133" y="118" class="facade-text">ChatFacade</text>
    <text x="1133" y="134" class="facade-text">.getChannelsByBoard(id)</text>
  </g>

</svg>