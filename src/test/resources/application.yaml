spring:
  application:
    name: api-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS platform\;CREATE SCHEMA IF NOT EXISTS proms
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false

management:
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

sentry:
  dsn: ""
