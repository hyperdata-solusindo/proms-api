spring.application.name=api

# Otomatis mengimpor variabel konfigurasi dari file .env (jika ada)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${APP_PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5443}/${DB_NAME:proms}}
spring.datasource.username=${DB_USER:platform_user}
spring.datasource.password=${DB_PASSWORD:platform_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Security & Token Configurations
app.security.token.ttl-days=${AUTH_TOKEN_TTL_DAYS:30}
app.security.token.sliding-window-days=${AUTH_TOKEN_SLIDING_WINDOW_DAYS:7}
