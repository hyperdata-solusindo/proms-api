spring.application.name=api
server.port=${APP_PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5443}/${DB_NAME:app_platform}}
spring.datasource.username=${DB_USER:platform_user}
spring.datasource.password=${DB_PASSWORD:platform_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=${LIQUIBASE_ENABLED:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
