# ===================================================================
# Core Spring Configuration
# ===================================================================
spring.application.name=${PROJECT_NAME:proms-api}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=

# DataSource & Connection Pool
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:proms_db}?currentSchema=${DB_SCHEMA:public}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${DB_SCHEMA:public}
spring.liquibase.liquibase-schema=${DB_SCHEMA:public}
spring.liquibase.enabled=${LIQUIBASE_ENABLED:true}

# Security & Tokens
app.security.token.ttl-days=${AUTH_TOKEN_TTL_DAYS:30}
app.security.token.sliding-window-days=${AUTH_TOKEN_SLIDING_WINDOW_DAYS:7}

# ===================================================================
# Redis & Rate Limiter Configuration
# ===================================================================
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:platform_redis_pass}
spring.data.redis.timeout=2000ms

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Tier 1: Edge Pre-Auth
app.rate-limit.edge.ip-capacity=100
app.rate-limit.edge.ip-refill-tokens=100
app.rate-limit.edge.ip-refill-duration=1s
app.rate-limit.edge.ip-max-concurrent=20
app.rate-limit.auth.ip-capacity=15
app.rate-limit.auth.ip-refill-tokens=15
app.rate-limit.auth.ip-refill-duration=1m
# Tier 2: Post-Auth
app.rate-limit.auth.account-capacity=5
app.rate-limit.auth.account-refill-tokens=5
app.rate-limit.auth.account-refill-duration=1m
app.rate-limit.user.capacity=60
app.rate-limit.user.refill-tokens=60
app.rate-limit.user.refill-duration=1m
app.rate-limit.user.max-concurrent=10
app.rate-limit.tenant.capacity=1000
app.rate-limit.tenant.refill-tokens=1000
app.rate-limit.tenant.refill-duration=1m
app.rate-limit.tenant.max-concurrent=50
app.rate-limit.public-general.capacity=30
app.rate-limit.public-general.refill-tokens=30
app.rate-limit.public-general.refill-duration=1m

# ===================================================================
# OpenTelemetry & Tracing (.env mapped)
# Compatible with Spring Boot 4 / Micrometer Tracing 4.x
# ===================================================================
management.tracing.enabled=${OTEL_TRACING_ENABLED:true}
# Spring Boot 4: saklar ekspor trace OTLP (false = tidak ada pengiriman ke collector)
management.tracing.export.otlp.enabled=${OTEL_TRACING_ENABLED:true}
management.tracing.sampling.probability=${OTEL_SAMPLING_PROBABILITY:${OTEL_TRACING_PROBABILITY:1.0}}

# Spring Boot 4 OTel properties
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.timeout=${OTEL_TIMEOUT_SECONDS:2s}

# Legacy/Alternative properties compatibility
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.timeout=${OTEL_TIMEOUT_SECONDS:2s}
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:false}

# OTel Standard Resource Attributes
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.service.version=${APP_VERSION:0.0.1}
management.opentelemetry.resource-attributes.deployment.environment=${SPRING_PROFILES_ACTIVE:local}

# ===================================================================
# Sentry Error Reporting (.env mapped)
# ===================================================================
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
sentry.server-name=${spring.application.name}
sentry.release=${spring.application.name}@${APP_VERSION:0.0.1}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}
sentry.send-default-pii=false
sentry.exception-resolver-order=-2147483648

# ===================================================================
# Sensitive Data Masking (.env mapped)
# ===================================================================
app.masking.enabled=${MASKING_ENABLED:true}
app.masking.additional-keys=${MASKING_ADDITIONAL_KEYS:}

# ===================================================================
# Actuator Endpoints & Metrics
# ===================================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:local}

# ===================================================================
# Cache Management (Caffeine L1 Cache)
# ===================================================================
spring.cache.type=caffeine
app.cache.caffeine.ttl-minutes=${CACHE_TTL_MINUTES:10}
app.cache.caffeine.max-size=${CACHE_MAX_SIZE:5000}

# ===================================================================
# OpenAPI / Swagger
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.hyperdata.proms=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.liquibase=INFO
