name: Deep Security Audit (Cloudflare Standard)

on:
  schedule:
    # Setiap hari Minggu jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * 0'
  pull_request:
    types: [labeled]
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Audit Scope'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'auth-and-multi-tenancy'
          - 'data-layer'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  security-audit:
    name: Cloudflare Security Audit Engine
    if: |
      github.event_name != 'pull_request' ||
      github.event.label.name == 'audit:deep-security'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloudflare Multi-Phase Security Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_EVENT: ${{ github.event_name }}
          AUDIT_SCOPE: ${{ inputs.scope }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import glob
          import time
          import urllib.request
          import urllib.error

          gemini_key = os.environ.get("GEMINI_API_KEY", "").strip()
          preferred_model = os.environ.get("GEMINI_MODEL", "").strip()
          github_token = os.environ.get("GITHUB_TOKEN", "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
          is_pr = os.environ.get("IS_PR", "false").lower() == "true"
          pr_number = os.environ.get("PR_NUMBER", "").strip()
          trigger_event = os.environ.get("TRIGGER_EVENT", "unknown")
          scope = os.environ.get("AUDIT_SCOPE", "").strip() or "full"

          if not gemini_key:
              print("::notice ::GEMINI_API_KEY secret is not configured. Skipping security audit.")
              sys.exit(0)

          # 1. Gather critical security source files
          target_patterns = [
              "src/main/java/**/*Filter*.java",
              "src/main/java/**/*Security*.java",
              "src/main/java/**/*Auth*.java",
              "src/main/java/**/*Client*.java",
              "src/main/java/**/*RateLimit*.java",
              "src/main/java/**/*Controller*.java",
              "src/main/java/**/*Repository*.java",
              "src/main/java/**/*Entity*.java",
              "src/main/resources/application*.yml"
          ]

          collected_files = []
          for pat in target_patterns:
              for filepath in glob.glob(pat, recursive=True):
                  if filepath not in collected_files:
                      collected_files.append(filepath)

          collected_files.sort()
          print(f"Auditing {len(collected_files)} core security surfaces under scope: '{scope}'...")

          # Read samples of code surfaces (bounded to keep token limit safe)
          code_context = ""
          total_chars = 0
          for fpath in collected_files:
              try:
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                      if total_chars + len(content) > 30000:
                          code_context += f"\n\n// File: {fpath} (Truncated preview)\n" + content[:1000]
                          break
                      code_context += f"\n\n// File: {fpath}\n" + content
                      total_chars += len(content)
              except Exception as e:
                  print(f"Skipping {fpath}: {e}")

          # 2. Read Pure Cloudflare Security Audit Skill & Repository Security Standard
          cf_skill_dir = ".agents/skills/cloudflare-security-audit"
          if not os.path.exists(cf_skill_dir):
              print("Fetching pure Cloudflare security audit skill from upstream (cloudflare/security-audit-skill)...")
              try:
                  os.system("git clone --depth 1 https://github.com/cloudflare/security-audit-skill.git .agents/skills/cloudflare-security-audit")
              except Exception as e:
                  print(f"Warning: could not clone upstream Cloudflare skill: {e}")

          # Load key Cloudflare Framework instructions and companion attack classes
          cf_skill_files = [
              ("Framework Core", f"{cf_skill_dir}/SKILL.md", 6000),
              ("Attack Classes Taxonomy", f"{cf_skill_dir}/ATTACK-CLASSES.md", 5000),
              ("Data Isolation & Lifecycle", f"{cf_skill_dir}/DATA-ISOLATION-AND-LIFECYCLE.md", 4000),
              ("Web Protocol & Auth", f"{cf_skill_dir}/WEB-PROTOCOL-AND-AUTH.md", 4000),
              ("Resource Exhaustion & Availability", f"{cf_skill_dir}/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md", 4000)
          ]

          cf_skill_content = ""
          for title, cf_f, char_limit in cf_skill_files:
              if os.path.exists(cf_f):
                  try:
                      with open(cf_f, "r", encoding="utf-8", errors="ignore") as f:
                          cf_skill_content += f"\n\n--- [CLOUDFLARE SECURITY AUDIT: {title}] ---\n" + f.read()[:char_limit]
                  except Exception as e:
                      print(f"Skipping {cf_f}: {e}")

          repo_skill_content = ""
          repo_skill_path = ".agents/skills/security-and-multi-tenancy/SKILL.md"
          if os.path.exists(repo_skill_path):
              with open(repo_skill_path, "r", encoding="utf-8") as sf:
                  repo_skill_content = sf.read()

          # 3. Construct Deep Security Evaluation Prompt
          prompt = f"""
          Anda adalah Chief Information Security Officer (CISO) & Vulnerability Hunter enterprise yang menggunakan metodologi murni Cloudflare Security Audit Framework (https://github.com/cloudflare/security-audit-skill).
          Lakukan audit keamanan mendalam pada codebase Java enterprise 'hyperdata-solusindo/proms-api-java'.

          === METODOLOGI MURNI CLOUDFLARE SECURITY AUDIT (https://github.com/cloudflare/security-audit-skill) ===
          {cf_skill_content}

          === STANDAR MULTI-TENANCY & ATURAN KEAMANAN REPOSITORI PROMS ===
          {repo_skill_content}

          === DAFTAR BERKAS PERMUKAAN SERANGAN (ATTACK SURFACES) ===
          {json.dumps(collected_files, indent=2)}

          === KODE SUMBER KRUSIAL TERPILIH ===
          {code_context}
          ====================================================================

          Lakukan analisis multi-fase sesuai metodologi Cloudflare terhadap kategori serangan utama:
          1. **Tenant & Object Isolation (BOLA / IDOR)**: Apakah query memvalidasi tenant ID? Apakah cross-tenant IDOR mengembalikan HTTP 404 ResourceNotFoundException (bukan 403) untuk mencegah information disclosure? Apakah cache key berpotensi collision?
          2. **Web Protocol & Authentication**: Verifikasi Personal Access Token (PAT) format (<tokenId>|<plainToken>), hashing SHA-256, sliding window TTL, filter boundary, session fixation, timing attack.
          3. **Resource Exhaustion & Availability (DoS / Throttling)**: Unbounded queries tanpa limit/pageable, N+1 query loop, 2-Tier Distributed Rate Limiting (Pre-auth IP tier & Post-auth Tenant/User tier via Bucket4j + Redis).
          4. **Data Privacy & Secrets (UU PDP No. 27/2022)**: Kebocoran PII pada logging, hardcoded credentials.

          Format laporan output dalam bahasa Indonesia dengan struktur Markdown berikut:
          # 🛡️ Laporan Audit Keamanan Mendalam (Pure Cloudflare Security Audit Standard)

          > **Audit Trigger**: `{trigger_event}` • **Audit Scope**: `{scope}` • **Framework**: `Cloudflare Security Audit Skill (https://github.com/cloudflare/security-audit-skill)` • **Files Analyzed**: `{len(collected_files)} core security files`

          ## 1. 📊 Ringkasan Postur Keamanan
          (Penilaian ringkas 2-3 kalimat mengenai ketahanan aplikasi terhadap serangan siber & kebocoran tenant).

          ## 2. 🚦 Matriks Evaluasi Attack Classes (Cloudflare Standard)

          | Attack Class | Status | Keterangan & Analisis Sumber |
          | :--- | :---: | :--- |
          | **Tenant & Object Isolation (BOLA/IDOR)** | 🟢 **PASS** / 🔴 **HIGH** / 🟡 **MED** | (Analisis isolasi query, IDOR 404 disguise & cache prefix) |
          | **Token & PAT Sliding Window Boundary** | 🟢 **PASS** / 🔴 **HIGH** / 🟡 **MED** | (Analisis isolasi filter, PAT hash SHA-256 & sliding window TTL) |
          | **Resource Exhaustion & 2-Tier Rate Limiting** | 🟢 **PASS** / 🔴 **HIGH** / 🟡 **MED** | (Analisis query boundaries, anti-N+1, & Bucket4j Redis Throttling) |
          | **Secret Hygiene & Privacy (UU PDP)** | 🟢 **PASS** / 🔴 **HIGH** / 🟡 **MED** | (Analisis credentials & sanitasi data) |

          ## 3. 🔍 Rincian Temuan & Rekomendasi Mitigasi
          (Jika ada temuan berikan rincian file, bukti kode, dan solusi DO vs DON'T. Jika bersih, nyatakan bukti kekokohan arsitektur).

          ## 4. 🏁 Kesimpulan & Verdict Keamanan
          > [!NOTE]
          > ### 🟢 VERDICT: `[SECURE / AUDIT_PASSED]`
          > (atau `> [!CAUTION] ### 🔴 VERDICT: [ACTION_REQUIRED]` jika ditemukan kerentanan berisiko).
          """

          # 4. Fast-path model priority (instant execution without upfront ListModels roundtrip)
          default_fast_models = [
              "gemini-3.6-flash",       # High Availability Stable (paling tahan spike 503)
              "gemini-3.8-flash",       # Flagship Flash (kapabilitas penalaran tertinggi)
              "gemini-3.5-flash-lite",  # Throughput tinggi
              "gemini-3.1-flash-lite",  # Fallback lite
              "gemini-3-flash-preview"  # Fallback preview
          ]
          candidate_models = []
          if preferred_model:
              candidate_models.append(preferred_model)
          for m in default_fast_models:
              if m not in candidate_models:
                  candidate_models.append(m)

          print(f"Fast-path model priority list: {candidate_models}")

          audit_report = None
          model_errors = []

          for model_name in candidate_models:
              gemini_url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={gemini_key}"
              payload = json.dumps({
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "maxOutputTokens": 8192,
                      "temperature": 0.2
                  }
              }).encode("utf-8")

              model_succeeded = False
              for attempt in range(1, 4):
                  req = urllib.request.Request(
                      gemini_url,
                      data=payload,
                      headers={"Content-Type": "application/json"}
                  )
                  try:
                      print(f"Running deep security audit with {model_name} (attempt {attempt}/3)...")
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          res = json.loads(resp.read().decode("utf-8"))
                          candidate = res.get("candidates", [{}])[0]
                          finish_reason = candidate.get("finishReason", "")
                          parts = candidate.get("content", {}).get("parts", [])
                          audit_report = "".join(p.get("text", "") for p in parts if not p.get("thought", False)).strip()
                          print(f"Security audit generated successfully via {model_name} (finishReason: {finish_reason}, length: {len(audit_report)} chars)")
                          model_succeeded = True
                          break
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8", errors="ignore")
                      err_msg = f"Model {model_name} HTTP {e.code}: {err_body}"
                      if e.code in (503, 429) and attempt < 3:
                          backoff = attempt * 5
                          print(f"::warning ::{err_msg} -> Retrying in {backoff}s (attempt {attempt}/3)...")
                          time.sleep(backoff)
                          continue
                      print(f"::warning ::{err_msg}")
                      model_errors.append(err_msg)
                      break
                  except Exception as e:
                      err_msg = f"Model {model_name} Error: {str(e)}"
                      if attempt < 3:
                          backoff = attempt * 3
                          print(f"::warning ::{err_msg} -> Retrying in {backoff}s (attempt {attempt}/3)...")
                          time.sleep(backoff)
                          continue
                      print(f"::warning ::{err_msg}")
                      model_errors.append(err_msg)
                      break

              if model_succeeded and audit_report:
                  break

          if not audit_report:
              all_errors = "\n".join(model_errors)
              print(f"::error ::Security audit failed on all models.\n{all_errors}")
              # Create GitHub Issue for execution failure
              if github_token and repo:
                  err_title = f"🚨 [Security Audit Error] Gagal Menjalankan Security Audit ({trigger_event} - {time.strftime('%Y-%m-%d')})"
                  err_body = f"### ⚠️ Kegagalan Eksekusi Security Audit Engine\n\nWorkflow Security Audit gagal diselesaikan pada seluruh model:\n\n```text\n{all_errors}\n```"
                  err_payload = json.dumps({
                      "title": err_title,
                      "body": err_body,
                      "labels": ["security", "bug"]
                  }).encode("utf-8")
                  try:
                      err_req = urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/issues",
                          data=err_payload,
                          headers={
                              "Authorization": f"Bearer {github_token}",
                              "Accept": "application/vnd.github.v3+json",
                              "Content-Type": "application/json",
                              "User-Agent": "PROMS-Cloudflare-Security-Auditor"
                          }
                      )
                      urllib.request.urlopen(err_req, timeout=30)
                      print("Created GitHub Issue for audit execution failure.")
                  except Exception as e:
                      print(f"::warning ::Failed to create error issue: {e}")
              sys.exit(1)

          # 5. Save report to artifact files
          os.makedirs("security-audit-results", exist_ok=True)
          with open("security-audit-results/SECURITY-REPORT.md", "w", encoding="utf-8") as f:
              f.write(audit_report)

          machine_findings = {
              "audit_timestamp": time.time(),
              "scope": scope,
              "trigger_event": trigger_event,
              "files_audited_count": len(collected_files),
              "raw_report_file": "SECURITY-REPORT.md"
          }
          with open("security-audit-results/findings.json", "w", encoding="utf-8") as f:
              json.dump(machine_findings, f, indent=2)

          print("Audit artifacts created: SECURITY-REPORT.md, findings.json")

          # 6. Notifications & Issue Creation
          # A. If triggered on PR with label, post comment to PR
          if is_pr and pr_number:
              gh_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
              comment_payload = json.dumps({"body": audit_report}).encode("utf-8")
              gh_req = urllib.request.Request(
                  gh_url,
                  data=comment_payload,
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Accept": "application/vnd.github.v3+json",
                      "Content-Type": "application/json",
                      "User-Agent": "PROMS-Cloudflare-Security-Auditor"
                  }
              )
              try:
                  with urllib.request.urlopen(gh_req, timeout=30) as resp:
                      print("Deep security audit report posted successfully to PR!")
              except Exception as e:
                  print(f"::warning ::Failed to post audit comment to PR: {e}")

          # B. If findings (Vulnerability / Critical / High / Action Required) detected outside PR, automatically create an Issue
          has_vulnerabilities = any(keyword in audit_report for keyword in [
              "[ACTION_REQUIRED]",
              "🔴",
              "**HIGH**",
              "CRITICAL",
              "VULNERABILITY"
          ])

          if has_vulnerabilities and not is_pr:
              print("Vulnerability findings detected. Automatically creating a new GitHub Issue...")
              issue_url = f"https://api.github.com/repos/{repo}/issues"
              issue_title = f"🚨 [Security Alert] Temuan Kerentanan ({trigger_event} - {time.strftime('%Y-%m-%d')})"
              issue_payload = json.dumps({
                  "title": issue_title,
                  "body": audit_report,
                  "labels": ["security", "vulnerability"]
              }).encode("utf-8")
              issue_req = urllib.request.Request(
                  issue_url,
                  data=issue_payload,
                  headers={
                      "Authorization": f"Bearer {github_token}",
                      "Accept": "application/vnd.github.v3+json",
                      "Content-Type": "application/json",
                      "User-Agent": "PROMS-Cloudflare-Security-Auditor"
                  }
              )
              try:
                  with urllib.request.urlopen(issue_req, timeout=30) as resp:
                      created_issue = json.loads(resp.read().decode("utf-8"))
                      print(f"Successfully created GitHub Issue: {created_issue.get('html_url')}")
              except Exception as e:
                  print(f"::error ::Failed to create GitHub Issue: {e}")
          EOF

      - name: Upload Security Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-results/
          retention-days: 30
