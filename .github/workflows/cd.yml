name: CD - Label & Tag Based Deployment

on:
  # 1. Trigger via Pull Request Labels (Branch-Agnostic Staging Preview)
  pull_request:
    types: [labeled, synchronize]

  # 2. Trigger via Tag Release (Production Deployment)
  push:
    tags:
      - 'v*.*.*'

  # 3. Manual On-Demand Trigger with Target Environment Selection
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        type: choice
        default: 'staging-1'
        options:
          - 'staging-1'
          - 'staging-2'
          - 'production'
      ref:
        description: 'Git Ref / Branch / Tag to deploy (e.g. main, dev, feature/xxx)'
        required: false
        default: ''

concurrency:
  # Lock per environment agar tidak terjadi race condition deployment di server yang sama
  group: cd-${{ github.event_name }}-${{ github.event.inputs.target_env || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write
  checks: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Phase 1: Determine Deployment Intent & Environment Routing
  # ============================================================================
  resolve-intent:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      target_env: ${{ steps.resolve.outputs.target_env }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      is_pr: ${{ steps.resolve.outputs.is_pr }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - id: resolve
        run: |
          EVENT="${{ github.event_name }}"
          SHOULD_DEPLOY="false"
          TARGET_ENV=""
          IMAGE_TAG=""
          IS_PR="false"
          PR_NUM=""

          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="${{ github.event.inputs.target_env }}"
            IMAGE_TAG="manual-${{ github.sha }}"

          elif [ "$EVENT" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SHOULD_DEPLOY="true"
            TARGET_ENV="production"
            IMAGE_TAG="${GITHUB_REF#refs/tags/}"

          elif [ "$EVENT" = "pull_request" ]; then
            IS_PR="true"
            PR_NUM="${{ github.event.pull_request.number }}"
            LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'

            # Periksa apakah terdapat label deployment target
            if echo "$LABELS" | grep -q "deploy:staging-1"; then
              SHOULD_DEPLOY="true"
              TARGET_ENV="staging-1"
              IMAGE_TAG="pr-${PR_NUM}-${{ github.sha }}"
            elif echo "$LABELS" | grep -q "deploy:staging-2"; then
              SHOULD_DEPLOY="true"
              TARGET_ENV="staging-2"
              IMAGE_TAG="pr-${PR_NUM}-${{ github.sha }}"
            else
              echo "No deployment label detected (deploy:staging-1 or deploy:staging-2). Skipping CD."
            fi
          fi

          echo "Event: $EVENT | Should Deploy: $SHOULD_DEPLOY | Target Env: $TARGET_ENV | Image Tag: $IMAGE_TAG"
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "is_pr=$IS_PR" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT

  # ============================================================================
  # Phase 2: CI Verification Quality Gate (Pastikan CI Lolos Sebelum Deploy)
  # ============================================================================
  verify-ci:
    name: Verify CI Checks Passed
    needs: resolve-intent
    if: needs.resolve-intent.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait and verify that CI workflow succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "⏳ Checking CI status for commit $COMMIT_SHA..."
          # Polling status commit check dari GitHub API (maksimal 10 menit)
          for i in $(seq 1 40); do
            # Ambil status check suite untuk commit saat ini
            STATUSES=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs" \
              --jq '.check_runs[] | select(.name | contains("Java Verification")) | {status: .status, conclusion: .conclusion}')
            
            CHECK_STATUS=$(echo "$STATUSES" | jq -r '.status // empty')
            CHECK_CONCLUSION=$(echo "$STATUSES" | jq -r '.conclusion // empty')

            echo "[$i/40] Java Verification Check status: '$CHECK_STATUS', conclusion: '$CHECK_CONCLUSION'..."

            if [ "$CHECK_STATUS" = "completed" ]; then
              if [ "$CHECK_CONCLUSION" = "success" ]; then
                echo "✅ CI verification passed successfully! Proceeding to deployment."
                exit 0
              else
                echo "❌ CI verification failed with conclusion: '$CHECK_CONCLUSION'!"
                echo "Deployment aborted to protect server stability."
                exit 1
              fi
            fi

            sleep 15
          done

          echo "⚠️ Timeout waiting for CI verification to complete. Aborting deployment."
          exit 1

  # ============================================================================
  # Phase 3: Build & Push Container Image to GHCR
  # ============================================================================
  build-and-push:
    name: Package & Push Docker Image
    needs: [resolve-intent, verify-ci]
    if: needs.resolve-intent.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full_image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve-intent.outputs.image_tag }}
            type=raw,value=${{ needs.resolve-intent.outputs.target_env }}-latest

      - name: Build and load container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: |
            proms-api-deploy-scan:inspect
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Enterprise Security Gate - Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'proms-api-deploy-scan:inspect'
          format: 'table'
          exit-code: '1' # Enterprise Blocking Gate: Blokir deploy jika ada CRITICAL vulnerability yang ada fix-nya
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Docker image to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Pushing $tag to GHCR..."
              docker push "$tag"
            fi
          done

  # ============================================================================
  # Phase 4: Rollout Deployment to Local Staging (Windows Self-Hosted)
  # ============================================================================
  deploy:
    name: Deploy to Local Staging (Windows Self-Hosted)
    needs: [resolve-intent, build-and-push]
    if: needs.resolve-intent.outputs.should_deploy == 'true'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 10
    environment: ${{ needs.resolve-intent.outputs.target_env }}
    env:
      TARGET_ENV: ${{ needs.resolve-intent.outputs.target_env }}
      IMAGE_TAG: ${{ needs.resolve-intent.outputs.image_tag }}
      PR_NUMBER: ${{ needs.resolve-intent.outputs.pr_number }}
      IS_PR: ${{ needs.resolve-intent.outputs.is_pr }}
      CONTAINER_NAME: proms-api-${{ needs.resolve-intent.outputs.target_env }}
      HOST_PORT: ${{ vars.VPS_HOST_PORT || '8080' }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Source & Templates
        uses: actions/checkout@v4

      - name: Execute Local Docker Deployment
        env:
          FULL_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.resolve-intent.outputs.image_tag }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "🚀 Deploying locally to Docker Desktop on Windows ($env:TARGET_ENV)..."

          # 1. Login ke GHCR di Docker Windows
          $env:GH_TOKEN | docker login ghcr.io -u $env:GH_ACTOR --password-stdin

          # 2. Buat network docker jika belum ada
          docker network create proms-network 2>$null

          # 3. Pull image yang baru saja dibuild
          Write-Host "📥 Pulling image: $env:FULL_IMAGE"
          docker pull $env:FULL_IMAGE

          # 4. Siapkan file .env lokal jika belum ada
          if (-not (Test-Path .env)) {
            Write-Host "Membuat file .env dari .env.example..."
            Copy-Item .env.example .env
          }

          # 5. Jalankan Database Migration Job (One-shot)
          Write-Host "🛠️ Running Database Migration Job..."
          docker run --rm --network proms-network --env-file .env -e LIQUIBASE_ENABLED=true $env:FULL_IMAGE db:migrate

          # 6. Restart Container Aplikasi di Docker Lokal
          Write-Host "🔄 Starting container $env:CONTAINER_NAME on port $env:HOST_PORT..."
          docker stop $env:CONTAINER_NAME 2>$null
          docker rm -f $env:CONTAINER_NAME 2>$null

          docker run -d `
            --name $env:CONTAINER_NAME `
            --restart unless-stopped `
            --network proms-network `
            -p "$($env:HOST_PORT):8080" `
            --env-file .env `
            -e LIQUIBASE_ENABLED=false `
            $env:FULL_IMAGE

          # 7. Polling Health Check
          Write-Host "🔍 Verifying Actuator Health Check on port $env:HOST_PORT..."
          $healthy = $false
          for ($i = 1; $i -le 12; $i++) {
            $response = curl.exe -s "http://localhost:$($env:HOST_PORT)/actuator/health/liveness"
            if ($response -match '"status":"UP"') {
              Write-Host "✅ Spring Boot is UP and healthy on your local machine!"
              $healthy = $true
              break
            }
            Write-Host "Waiting for app to start ($i/12)..."
            Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
            Write-Host "⚠️ Health check timed out after 60s, showing logs:"
            docker logs --tail 50 $env:CONTAINER_NAME
            exit 1
          }

      # ========================================================================
      # Phase 5: Notify Pull Request
      # ========================================================================
      - name: Post Deployment URL Comment to Pull Request
        if: env.IS_PR == 'true' && env.PR_NUMBER != ''
        uses: actions/github-script@v7
        with:
          script: |
            const envName = process.env.TARGET_ENV;
            const prNum = process.env.PR_NUMBER;
            const imgTag = process.env.IMAGE_TAG;
            const hostPort = process.env.HOST_PORT || '8080';
            const commitSha = context.sha.substring(0, 7);

            const commentBody = `### 🚀 Local Staging Deployment Ready!

            | Parameter | Detail |
            | :--- | :--- |
            | **Environment** | \`${envName}\` |
            | **Runner Target** | Local Windows Self-Hosted (\`${process.env.RUNNER_NAME || 'Windows-Runner'}\`) |
            | **Local URL** | [http://localhost:${hostPort}](http://localhost:${hostPort}) |
            | **Commit** | \`${commitSha}\` |
            | **Docker Image** | \`ghcr.io/${context.repo.owner}/${context.repo.repo}:${imgTag}\` |
            | **Health Check** | 🟢 \`UP\` (/actuator/health/liveness) |

            > [!NOTE]
            > Container sedang berjalan di Docker Desktop PC lokal Anda pada port \`${hostPort}\`.`;

            github.rest.issues.createComment({
              issue_number: prNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
