# Nginx Configuration for Proms API Blue/Green Deployment
# File ini di-include oleh /etc/nginx/sites-available/proms-api.conf pada VPS

upstream proms_backend {
    # File ini akan di-update secara dinamis oleh deploy-blue-green.sh
    include /etc/nginx/conf.d/proms-active-upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    server_name ${DOMAIN_NAME:-api.yourdomain.com};

    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://proms_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Direct Actuator Health Check Bypass for Monitoring
    location /actuator/health {
        proxy_pass http://proms_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
